# AppDimens KMP — Gradle properties
org.gradle.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# R8
# AGP 9+ runs R8 in full mode ALWAYS: this property is a legacy no-op kept only
# as documentation (mirrors the Android original). Consumer-rules.pro files and
# test fixtures rely on full-mode semantics (shrinking + renaming), which cannot
# be switched off on AGP 9.
android.enableR8.fullMode=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false

# Kotlin
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform — experimental macOS target
org.jetbrains.compose.experimental.macos.enabled=true

# Version — 1.0.0 is the first stable Kotlin Multiplatform release.
appdimens.version=1.0.0
# Use the system Node.js instead of downloading a distribution (wasmJs browser build)
kotlin.js.nodejs.download=false
