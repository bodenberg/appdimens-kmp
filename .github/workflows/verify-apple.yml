name: verify-apple

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # EN Apple targets supported by Compose Multiplatform 1.11: iosArm64,
      #    iosSimulatorArm64, macosArm64 (Intel Apple targets publish no Compose
      #    `ui` artifacts, and tvOS/watchOS are not published either — the
      #    Compose layer cannot compile there; the code API only works on targets
      #    whose hierarchy excludes composeMain, which Intel Apple would not).
      # PT Targets Apple suportados pelo Compose Multiplatform 1.11: iosArm64,
      #    iosSimulatorArm64, macosArm64 (Apple Intel não tem artefatos `ui` do
      #    Compose, e tvOS/watchOS também não são publicados — a camada Compose
      #    não compila nesses targets).
      - name: Compile iOS (ARM64)
        run: ./gradlew :library:compileKotlinIosArm64 --no-daemon --stacktrace

      - name: Compile iOS Simulator (ARM64)
        run: ./gradlew :library:compileKotlinIosSimulatorArm64 --no-daemon --stacktrace

      - name: Compile macOS (ARM64)
        run: ./gradlew :library:compileKotlinMacosArm64 --no-daemon --stacktrace

      # EN This library publishes KMP Maven variants (klib), not Apple
      #    frameworks: `binaries.framework` is deliberately NOT configured, so
      #    `linkDebugFrameworkIosSimulatorArm64` does not exist. The compile
      #    steps above are the correct Apple gates.
      # PT Esta biblioteca publica variantes Maven KMP (klib), não frameworks
      #    Apple: `binaries.framework` é propositalmente NÃO configurado, então
      #    `linkDebugFrameworkIosSimulatorArm64` não existe. Os passos de compile
      #    acima são os gates Apple corretos.
